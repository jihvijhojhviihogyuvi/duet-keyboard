plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lilt.duet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lilt.duet'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
